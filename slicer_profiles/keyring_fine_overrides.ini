# Loaded after keyring_overrides.ini by: slice_gcode.py --keyring --fine
# Best-quality small relief keyrings in PLA. Slow on purpose.
# Layers: 0.24 first + 0.12 each, so z = 2.04 and z = 3.00 are exact layer boundaries.
first_layer_height = 0.24
layer_height = 0.12
top_solid_layers = 6
bottom_solid_layers = 5
fill_density = 30%
perimeter_speed = 25
external_perimeter_speed = 15
small_perimeter_speed = 15
top_solid_infill_speed = 20
solid_infill_speed = 30
first_layer_speed = 15
seam_position = aligned
# Less stringing: lift over the print and keep travel moves inside the walls
retract_lift = 0.2
avoid_crossing_perimeters = 1
# Smooth flat tops
ironing = 1
ironing_type = top
ironing_speed = 20
ironing_flowrate = 12%
ironing_spacing = 0.1
